# Kinematics for prompt photon
# photon has momentum pg; gluon(quark) has momentum px; 
# radiated particle has moentum k

---
kinematics:
  incoming_momenta: [p1, p2]
  outgoing_momenta: [pg, px, k]
  momentum_conservation: [pg, p1 + p2 - px - k]
  kinematic_invariants:
    - [t,  2]
    - [u,  2]
    - [tk,  2]
    - [uk,  2]
    - [s4,  2]
  scalarproduct_rules:
    - [[p1,p1],  0]
    - [[p2,p2],  0]
    - [[pg,pg],  0]
    - [[px,px],  0]
    - [[k,k],  0]
    - [[p2-px, p2-px], t]
    - [[p1-px, p1-px], u]
    - [[p2-k, p2-k], tk]
    - [[p1-k, p1-k], uk]
    - [[k+px, k+px], s4]




